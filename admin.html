<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice – Lunch-TV</title>
<style>
  :root { --svart:#111; --röd:#c8161d; --grön:#26722e; --grå:#e9e9e6; --linje:#cfcfca; --bg:#f4f4f2; --gul:#fff3c4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--svart); font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--svart); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 19px; flex: 1; }
  header img { height: 34px; width: 34px; }
  main { max-width: 900px; margin: 0 auto; padding: 14px 14px 120px; }
  button, input, select { font: inherit; }
  button { min-height: 46px; padding: 8px 16px; border: 1px solid var(--svart); background: #fff; color: var(--svart); border-radius: 8px; cursor: pointer; }
  button.prim { background: var(--svart); color: #fff; font-weight: 700; }
  button.liten { min-height: 38px; padding: 4px 12px; }
  button.fara { color: var(--röd); border-color: var(--röd); }
  button:disabled { opacity: .45; }
  input[type=text], input[type=password], input[type=time], input[type=date], input[type=number] { width: 100%; min-height: 46px; padding: 8px 10px; border: 1px solid #8c8c86; border-radius: 8px; background: #fff; }
  label.f { display: block; font-weight: 600; margin: 12px 0 4px; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 14px; flex-wrap: wrap; }
  .tabs button { flex: 1; min-width: 100px; padding: 8px 6px; font-weight: 700; }
  .tabs button.on { background: var(--svart); color: #fff; }
  .kort { background: #fff; border: 1px solid var(--linje); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .kort h3 { margin: 0 0 2px; font-size: 18px; }
  h2 { margin: 18px 0 4px; font-size: 21px; }
  h2.dag { text-transform: capitalize; }
  h2.dag { border-bottom: 3px solid var(--svart); padding-bottom: 3px; }
  .info { background: var(--gul); border: 1px solid #e0c96a; border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .fel { background: #fde4e4; border: 1px solid #e29a9a; color: #7a1010; border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .pill { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--grå); }
  .pill.ok { background: #d5ecd7; color: #174a1c; }
  .pill.sak { background: #fde4e4; color: #7a1010; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 14px 4px 6px; border: 2px solid var(--linje); border-radius: 99px; background: #fff; font-weight: 600; }
  .chip .ic { width: 34px; height: 34px; border-radius: 50%; background: #9a9a95; display: inline-flex; align-items: center; justify-content: center; }
  .chip .ic svg { width: 68%; height: 68%; }
  .chip.on { border-color: var(--svart); background: #fff; }
  .chip.on .ic { background: var(--svart); }
  .rad { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rad > * { flex: 1; min-width: 120px; }
  .rad > button { flex: none; min-width: 0; }
  .sticky { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--linje); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; z-index: 6; }
  .sticky .txt { flex: 1; font-size: 15px; }
  .sticky button { min-width: 150px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--grön); color: #fff; padding: 12px 18px; border-radius: 10px; z-index: 9; max-width: 90vw; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .toast.fel { background: var(--röd); color: #fff; border: 0; }
  .dagar label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; min-height: 40px; }
  .dagar input, .kryss input { width: 22px; height: 22px; }
  .kryss { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .datum { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--linje); border-radius: 8px; padding: 4px 4px 4px 12px; margin: 4px 6px 4px 0; }
  .datum.gammal { opacity: .45; }
  .datum.idag { border-color: var(--röd); font-weight: 700; }
  .dim { color: #55554f; font-size: 15px; }
  #login { max-width: 420px; margin: 12vh auto; padding: 0 16px; }
</style>
</head>

<script>
/* ===== INSTÄLLNINGAR ===== */
const CONFIG = {
  api: "https://lunch-tv.tobias-roos.workers.dev",   // adressen till din Cloudflare-funktion, t.ex. "https://lunch-tv.dittnamn.workers.dev" (se BACKOFFICE.md)
};

const API = (new URLSearchParams(location.search).get("api") || CONFIG.api).replace(/\/$/, "");
const ALLERGENER = [
  ["gluten","Gluten","gluten"], ["laktos","Laktos","laktos"], ["nötter","Nötter","notter"], ["ägg","Ägg","agg"], ["fisk","Fisk","fisk"],
  ["skaldjur","Skaldjur","skaldjur"], ["blötdjur","Blötdjur","blotdjur"], ["selleri","Selleri","selleri"], ["senap","Senap","senap"],
  ["soja","Soja","soja"], ["sesam","Sesam","sesam"], ["jordnötter","Jordnötter","jordnotter"], ["lupin","Lupin","lupin"], ["sulfit","Sulfit","sulfit"],
];
const ALIAS = {"mjölk":"laktos","mjolk":"laktos","notter":"nötter","trädnötter":"nötter","agg":"ägg","blotdjur":"blötdjur","mollusker":"blötdjur","kräftdjur":"skaldjur","jordnotter":"jordnötter","sesamfrön":"sesam","spannmål":"gluten","svaveldioxid":"sulfit"};
const DAGAR = ["måndag","tisdag","onsdag","torsdag","fredag"];
const ALLA_DAGAR = [...DAGAR, "lördag", "söndag"];
const FILNAMN = {ean: "ean.json", slut: "slutsald.json", allergener: "allergener.json", lunch: "lunch.json", frukost: "frukost.json", brunch: "brunch.json", hockey: "hockey.json", oppett: "oppettider.json"};

let pin = "", flik = "slut", menu = null;
const D = {allergener: null, frukost: null, hockey: null};   // arbetskopior
const BAS = {};                                              // sparad version som text, för att se om något ändrats
const MSG = {};                                              // anmärkningar per flik

/* ---------- hjälpare ---------- */
const nz = s => String(s).toLowerCase().replace(/\s+/g, " ").trim();
const stor = s => s.charAt(0).toUpperCase() + s.slice(1);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(k === "class") e.className = v; else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v === true) e.setAttribute(k, ""); else if(v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const $ = id => document.getElementById(id);
const ser = o => JSON.stringify(o);
const smutsig = () => D[flik] && BAS[flik] !== ser(D[flik]);
function toast(t, fel){ const e = h("div", {class: "toast" + (fel ? " fel" : "")}, t); document.body.append(e); setTimeout(() => e.remove(), fel ? 7000 : 3500); }
const kopia = o => JSON.parse(JSON.stringify(o));

// Samma regel som TV-sidan och hamta_meny.py: namnet på rätten
function dela(r){
  if(r && typeof r === "object") return r.namn || "";
  const t = String(r).trim();
  let m = /^(.*?)\s+serveras\s+/i.exec(t); if(m) return m[1];
  m = /^(.*?)\s+[–-]\s+/.exec(t); if(m) return m[1];
  m = /^(.*?)\s+med\s+/i.exec(t); if(m) return m[1];
  return t;
}

async function api(väg, init){
  if(!API) throw new Error("Backoffice är inte kopplat till sin sparfunktion än (se BACKOFFICE.md).");
  let r;
  try { r = await fetch(API + väg, {...init, headers: {"x-pin": pin, ...(init && init.headers)}}); }
  catch(e){ throw new Error("Ingen kontakt med servern. Kontrollera nätverket."); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(j.fel || ("Fel " + r.status)); e.status = r.status; throw e; }
  return j;
}

/* ---------- allergenväljare (tre lägen: ej angivet / inga / valda) ---------- */
function allergVal(get, set, onChange){
  const wrap = h("div");
  const rita = () => {
    const v = get();
    const valda = Array.isArray(v) ? v : [];
    const pill = v === null || v === undefined ? h("span", {class: "pill sak"}, "Ej angivet – TV:n visar 'fråga personalen'")
      : !v.length ? h("span", {class: "pill ok"}, "Inga allergener")
      : h("span", {class: "pill ok"}, v.length + " valda");
    const chips = h("div", {class: "chips"}, ALLERGENER.map(([id, text, sym]) => {
      const på = valda.includes(id);
      return h("button", {type: "button", class: "chip" + (på ? " on" : ""), "aria-pressed": på, onclick: () => {
        const nya = på ? valda.filter(x => x !== id) : [...valda, id];
        set(nya.length ? ALLERGENER.map(a => a[0]).filter(x => nya.includes(x)) : null); rita(); onChange && onChange();
      }}, h("span", {class: "ic"}, svg(sym)), text);
    }));
    const knappar = h("div", {class: "rad"},
      h("button", {type: "button", class: "liten", onclick: () => { set([]); rita(); onChange && onChange(); }}, "Inga allergener"),
      h("button", {type: "button", class: "liten", onclick: () => { set(null); rita(); onChange && onChange(); }}, "Rensa (ej angivet)"));
    wrap.replaceChildren(pill, chips, knappar);
  };
  rita(); return wrap;
}
function svg(sym){
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#a-" + sym); s.append(u); return s;
}

/* ---------- inläsning ---------- */
async function läsMeny(){
  try { menu = (await api("/api/get?fil=menu.json")).data; } catch(e){ menu = null; }               // färskaste versionen direkt från GitHub
  if(!menu){ try { const r = await fetch("menu.json?t=" + Date.now(), {cache: "no-store"}); menu = r.ok ? await r.json() : null; } catch(e){ menu = null; } }
}
async function läs(){
  await läsMeny();
  for(const k of Object.keys(FILNAMN)){
    const j = await api("/api/get?fil=" + FILNAMN[k]);
    D[k] = j.data ? kopia(j.data) : null;
    MSG[k] = [];
    if(k === "allergener") D[k] = byggAllergener(D[k]);
    if(k === "slut"){ const i = iso(new Date()); D[k] = D[k] && D[k].datum === i ? D[k] : {...(D[k] && D[k]._info ? {_info: D[k]._info} : {}), datum: i, rätter: []}; }
    if(k === "frukost") D[k] = D[k] || {rubrik: "Frukost", tid: {start: "07:00", slut: "10:00"}, dagar: [...DAGAR], visaAllergener: true, rader: []};
    if(k === "brunch") D[k] = D[k] || {rubrik: "Brunch", tid: {start: "07:00", slut: "15:00"}, dagar: ["lördag"], rader: [{namn: "Brunchbuffé", pris: "99:-", beskrivning: "Inkl gröt, ägg, bacon & våfflor"}]};
    if(k === "ean") D[k] = D[k] ? {...D[k], rätter: D[k].rätter || {}} : {standardLunch: "", rätter: {}};
    if(k === "lunch") D[k] = D[k] || {tid: null, dagar: [...DAGAR]};
    if(k === "oppett"){ D[k] = D[k] || {rodaDagarStangt: true, undantag: []}; D[k].undantag = (D[k].undantag || []).filter(e => (e.till || e.datum) >= iso(new Date())); }
    if(k === "hockey") D[k] = D[k] || {rubrik: "Hockeykvällar i Focus Restaurang", underrubrik: "", banner: "Hockeykväll i restaurangen!", tid: {start: "16:30"}, matchstart: "19:00", datum: [], rader: [], paket: {namn: "Paketpris mat + dryck", pris: ""}};
    BAS[k] = k === "allergener" ? ser(D[k]) : ser(D[k]);
  }
}

/* Allergener: rätterna kommer från veckans meny (menu.json). Befintliga svar behålls om det är samma vecka. */
function byggAllergener(a){
  const ny = {};
  const veckaOk = a && menu && a.vecka === menu.vecka;
  const gamla = veckaOk ? a.dagar || {} : {};
  if(a && a._info) ny._info = a._info;
  ny.vecka = menu ? menu.vecka : (a ? a.vecka : null);
  ny.dagar = {};
  for(const dag of DAGAR){
    ny.dagar[dag] = {};
    const befintliga = gamla[dag] || {};
    ((menu && menu.dagar && menu.dagar[dag]) || []).forEach(r => {
      const namn = dela(r);
      const nyckel = Object.keys(befintliga).find(k => nz(k) === nz(namn));
      ny.dagar[dag][namn] = nyckel === undefined || !Array.isArray(befintliga[nyckel]) ? null : befintliga[nyckel];
    });
  }
  ny.vegetariskt = veckaOk && Array.isArray(a.vegetariskt) ? a.vegetariskt : null;
  MSG.allergener = [];
  if(!menu) MSG.allergener.push("Kunde inte läsa veckans meny. Rätterna kan inte visas.");
  else if(!veckaOk && a) MSG.allergener.push("Det är en ny vecka (vecka " + menu.vecka + "). Allergenerna från förra veckan är rensade. Fyll i för de nya rätterna.");
  return ny;
}

/* ---------- vyer ---------- */
function vyAllergener(){
  const a = D.allergener, rader = [];
  if(!menu) return h("div", {class: "fel"}, "Veckans meny kunde inte läsas, så rätterna kan inte visas.");
  const alla = [];
  DAGAR.forEach(d => Object.keys(a.dagar[d]).forEach(n => alla.push(a.dagar[d][n])));
  if(menu.vegetariskt) alla.push(a.vegetariskt);

const EAN_L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];

function eanKontroll(d){                                           // kontrollsiffra för en sifferrad utan kontrollsiffra
  let sum = 0;

  return (10 - sum % 10) % 10;

    h("div", {class: "info"}, "Tryck på ", h("b", {}, "Markera slutsåld"), " när en rätt tar slut. Den visas överstruken med en röd ", h("b", {}, "SLUTSÅLD"), "-skylt på TV:n. Allt nollställs automatiskt i morgon bitti."),
    !menu ? h("div", {class: "fel"}, "Veckans meny kunde inte läsas. Lunchrätterna visas inte här.") : null,
    !lunch.length && menu ? h("div", {class: "dim"}, "Ingen lunchmeny finns för idag (" + dagNamn + ").") : null,
    lista,
    extra.length ? h("div", {}, h("h2", {}, "Övriga markeringar"), extra.map(x => h("div", {class: "kort rad"}, h("b", {}, x), h("button", {class: "liten", onclick: () => { växla(x); ritaVy(); }}, "Ta bort")))) : null,
    sl.rätter.length ? h("p", {}, h("button", {class: "liten", onclick: () => { sl.rätter = []; ritaVy(); }}, "Nollställ allt (allt finns igen)")) : null);
}

/* ---------- röda dagar (samma beräkning som TV-sidan) ---------- */
function påsk(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const t = h + l - 7 * m + 114;
  return new Date(y, Math.floor(t / 31) - 1, (t % 31) + 1);
}
const plusDagar = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function rödaDagar(y){                                              // svenska helgdagar: [datum, namn]
  const p = påsk(y), r = [], add = (d, n) => r.push([iso(d), n]);
  add(new Date(y, 0, 1), "Nyårsdagen"); add(new Date(y, 0, 6), "Trettondedag jul"); add(plusDagar(p, -2), "Långfredagen");
  add(p, "Påskdagen"); add(plusDagar(p, 1), "Annandag påsk"); add(new Date(y, 4, 1), "Första maj");
  add(plusDagar(p, 39), "Kristi himmelsfärdsdag"); add(plusDagar(p, 49), "Pingstdagen"); add(new Date(y, 5, 6), "Nationaldagen");
  for(let i = 20; i <= 26; i++){ const x = new Date(y, 5, i); if(x.getDay() === 6) add(x, "Midsommardagen"); }
  for(let i = 0; i < 7; i++){ const x = new Date(y, 9, 31 + i); if(x.getDay() === 6) add(x, "Alla helgons dag"); }
  add(new Date(y, 11, 25), "Juldagen"); add(new Date(y, 11, 26), "Annandag jul");
  return r.sort();
}

function vyLunch(){
  const l = D.lunch, ica = menu && menu.lunchtid;
  const tider = h("div");
  const ritaTider = () => tider.replaceChildren(l.tid ? h("div", {class: "rad"},
    h("div", {}, h("label", {class: "f"}, "Lunch från"), h("input", {type: "time", value: l.tid.start, oninput: e => { l.tid.start = e.target.value; uppdStatus(); }})),
    h("div", {}, h("label", {class: "f"}, "Lunch till"), h("input", {type: "time", value: l.tid.slut, oninput: e => { l.tid.slut = e.target.value; uppdStatus(); }}))) : h("p", {class: "dim"}, "Just nu används ICA:s tider" + (ica ? ": " + ica.start + "–" + ica.slut + "." : ".")));
  ritaTider();
  return h("div", {},
    h("div", {class: "info"}, ica ? "ICA:s sida anger lunch " + ica.start + "–" + ica.slut + ". " : "", "Vill ni ha andra tider än ICA:s skriver ni in dem här, så gäller de på TV:n i stället."),
    h("div", {class: "kryss"}, h("input", {type: "checkbox", id: "egna", checked: !!l.tid, onchange: e => { l.tid = e.target.checked ? {start: (ica && ica.start) || "11:00", slut: (ica && ica.slut) || "14:30"} : null; ritaTider(); uppdStatus(); }}), h("label", {for: "egna"}, "Använd egna lunchtider")),
    tider,
    h("label", {class: "f"}, "Dagar då lunch serveras"),
    h("div", {class: "dagar"}, ALLA_DAGAR.map(d => h("label", {}, h("input", {type: "checkbox", checked: (l.dagar || []).includes(d), onchange: e => {
      l.dagar = ALLA_DAGAR.filter(x => x === d ? e.target.checked : (l.dagar || []).includes(x)); uppdStatus(); }}), d))),
    vyExtra());
}

/* ---------- extra lunchrätter (rätter som inte finns på hemsidan, gäller ett visst datum) ---------- */
function vyExtra(){
  const l = D.lunch, iD = iso(new Date());
  l.extra = (l.extra || []).filter(e => e.alltid === true || e.datum >= iD);      // gamla rensas bort automatiskt (alltid-rätter ligger kvar)
  const ny = {alltid: false, datum: iD, namn: "", beskrivning: "", etikett: "", pris: "", allergener: null};
  const lista = h("div"), form = h("div");
  const vd = s => ["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"][new Date(s + "T12:00:00").getDay()] + " " + s;
  const ritaLista = () => {
    const sd = e => e.alltid ? "" : e.datum;
    l.extra.sort((a, b) => sd(a) < sd(b) ? -1 : sd(a) > sd(b) ? 1 : 0);
    lista.replaceChildren(...(l.extra.length ? l.extra.map((e, i) => {
      const f = (etikett, nyckel, ph, bredd) => h("div", {style: "flex:" + bredd + ";min-width:130px"}, h("label", {class: "f"}, etikett), h("input", {type: "text", value: e[nyckel] || "", placeholder: ph, oninput: ev => { e[nyckel] = ev.target.value; uppdStatus(); }}));
      return h("div", {class: "kort"},
        h("div", {class: "dim"}, (e.alltid ? "Visas alla lunchdagar" : vd(e.datum)) + " · Allergener: " + (e.allergener === null || e.allergener === undefined ? "ej angivet" : e.allergener.length ? e.allergener.join(", ") : "inga")),
        h("div", {class: "rad"}, f("Namn", "namn", "", 3), f("Pris", "pris", "t.ex. 99:-", 1)),
        h("div", {class: "rad"}, f("Beskrivning", "beskrivning", "", 3), f("Etikett", "etikett", "t.ex. Take away", 1)),
        h("button", {type: "button", class: "liten fara", onclick: () => { l.extra.splice(i, 1); ritaLista(); uppdStatus(); }}, "Ta bort"));
    }) : [h("p", {class: "dim"}, "Inga extra rätter inlagda.")]));
  };
  const ritaForm = () => form.replaceChildren(
    h("div", {class: "kryss"}, h("input", {type: "checkbox", id: "alltid", checked: ny.alltid, onchange: e => { ny.alltid = e.target.checked; ritaForm(); }}), h("label", {for: "alltid"}, "Alltid på (visas varje lunchdag, t.ex. ett take away-alternativ)")),
    ...(ny.alltid ? [] : [h("label", {class: "f"}, "Datum"), h("input", {type: "date", value: ny.datum, min: iD, oninput: e => ny.datum = e.target.value})]),
    h("label", {class: "f"}, "Etikett över rätten (valfri)"), h("input", {type: "text", value: ny.etikett, placeholder: "t.ex. Take away", oninput: e => ny.etikett = e.target.value}),
    h("label", {class: "f"}, "Rättens namn"), h("input", {type: "text", value: ny.namn, placeholder: "t.ex. Dagens soppa", oninput: e => ny.namn = e.target.value}),
    h("label", {class: "f"}, "Pris (valfritt)"), h("input", {type: "text", value: ny.pris, placeholder: "t.ex. 99:-", oninput: e => ny.pris = e.target.value}),
    h("label", {class: "f"}, "Beskrivning (valfri)"), h("input", {type: "text", value: ny.beskrivning, placeholder: "t.ex. Med nybakat bröd", oninput: e => ny.beskrivning = e.target.value}),
    h("label", {class: "f"}, "Allergener"), allergVal(() => ny.allergener, v => ny.allergener = v),
    h("button", {type: "button", class: "prim", style: "margin-top:12px", onclick: () => {
      if((!ny.alltid && !ny.datum) || !ny.namn.trim()){ alert("Fyll i rättens namn" + (ny.alltid ? "." : " och datum.")); return; }
      const rätt = {namn: ny.namn.trim(), beskrivning: ny.beskrivning.trim(), etikett: ny.etikett.trim(), pris: ny.pris.trim(), allergener: ny.allergener};
      if(ny.alltid) rätt.alltid = true; else rätt.datum = ny.datum;
      l.extra.push(rätt);
      ny.namn = ""; ny.beskrivning = ""; ny.etikett = ""; ny.pris = ""; ny.allergener = null; ritaLista(); ritaForm(); uppdStatus();
    }}, "Lägg till rätten"));
  ritaLista(); ritaForm();
  return h("div", {},
    h("h2", {}, "Extra lunchrätter"),
    h("div", {class: "info"}, "Här lägger ni till rätter som inte finns på hemsidan. De visas på TV:n bredvid ICA:s rätter det datum ni väljer, och försvinner av sig själva dagen efter. Kryssar ni i Alltid på visas rätten varje lunchdag tills ni tar bort den. Glöm inte att spara längst ned."),
    lista, h("div", {class: "kort"}, h("h3", {}, "Lägg till rätt"), form));
}
function extraIdagNamn(){ const iD = iso(new Date()); return ((D.lunch && D.lunch.extra) || []).filter(e => e.alltid === true || e.datum === iD).map(e => e.namn); }

function vyStangt(){
  const o = D.oppett, idag = new Date(), iD = iso(idag);
  o.undantag = o.undantag || [];
  const vd = s => ["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"][new Date(s + "T12:00:00").getDay()] + " " + s;
  const täcker = (e, k) => e.datum <= k && k <= (e.till || e.datum);
  const röda = [...rödaDagar(idag.getFullYear()), ...rödaDagar(idag.getFullYear() + 1)].filter(x => x[0] >= iD).slice(0, 8);
  const lista = h("div"), egna = h("div");
  const sortera = () => o.undantag.sort((x, y) => x.datum < y.datum ? -1 : 1);
  const rita = () => {
    sortera();
    lista.replaceChildren(...röda.map(([k, namn]) => {
      const st = o.undantag.find(e => e.status === "stängt" && täcker(e, k)), öpp = o.undantag.find(e => e.status === "öppet" && täcker(e, k));
      const stängt = !!st || (!öpp && o.rodaDagarStangt);
      return h("div", {class: "kort rad", style: "border-color:" + (stängt ? "var(--röd)" : "var(--grön)")},
        h("div", {style: "flex:1;min-width:150px"}, h("h3", {}, namn), h("div", {class: "dim"}, vd(k)),
          stängt ? h("span", {class: "pill sak"}, "Stängt") : h("span", {class: "pill ok"}, öpp ? "Öppet (undantag)" : "Öppet")),
        öpp ? h("button", {class: "liten", onclick: () => { o.undantag = o.undantag.filter(e => e !== öpp); rita(); uppdStatus(); }}, "Stäng igen")
          : !stängt ? null : h("button", {class: "prim", onclick: () => { o.undantag.push({datum: k, status: "öppet", text: namn}); rita(); uppdStatus(); }}, "Ha öppet"));
    }));
    const övriga = o.undantag.filter(e => !(e.status === "öppet" && röda.some(r => täcker(e, r[0]))));
    egna.replaceChildren(...övriga.map(e => h("div", {class: "kort rad"},
      h("div", {style: "flex:1;min-width:150px"}, h("b", {}, e.till && e.till !== e.datum ? vd(e.datum) + " – " + vd(e.till) : vd(e.datum)), h("div", {class: "dim"}, (e.status === "öppet" ? "Öppet" : "Stängt") + (e.text ? ": " + e.text : ""))),
      h("button", {class: "liten fara", onclick: () => { o.undantag = o.undantag.filter(x => x !== e); rita(); uppdStatus(); }}, "Ta bort"))));
    if(!övriga.length) egna.append(h("p", {class: "dim"}, "Inga egna dagar inlagda."));
  };
  rita();
  const från = h("input", {type: "date"}), till = h("input", {type: "date"}), orsak = h("input", {type: "text", placeholder: "Orsak som visas på TV:n, t.ex. Personalfest"});
  return h("div", {},
    h("div", {class: "info"}, "På ", h("b", {}, "stängda dagar"), " visar TV:n hela dagen \"Stängt idag\" med orsak och när ni öppnar igen. Dagen före visas \"Stängt imorgon\" längst ner på skylten."),
    h("div", {class: "kryss"}, h("input", {type: "checkbox", id: "roda", checked: o.rodaDagarStangt !== false, onchange: e => { o.rodaDagarStangt = e.target.checked; rita(); uppdStatus(); }}), h("label", {for: "roda"}, "Stäng automatiskt på svenska röda dagar")),
    h("h2", {}, "Kommande röda dagar"), lista,
    h("h2", {}, "Egna stängda dagar"), egna,
    h("div", {class: "kort"}, h("h3", {}, "Stäng andra dagar"),
      h("div", {class: "rad"}, h("div", {}, h("label", {class: "f"}, "Från"), från), h("div", {}, h("label", {class: "f"}, "Till (valfritt)"), till)),
      h("label", {class: "f"}, "Orsak (valfri)"), orsak,
      h("p", {}, h("button", {class: "prim", onclick: () => {
        if(!från.value) return toast("Välj ett datum.", true);
        if(till.value && till.value < från.value) return toast("'Till' måste vara samma dag eller senare.", true);
        const e = {datum: från.value, status: "stängt"}; if(till.value && till.value !== från.value) e.till = till.value; if(orsak.value.trim()) e.text = orsak.value.trim();
        o.undantag.push(e); från.value = till.value = orsak.value = ""; rita(); uppdStatus(); }}, "+ Stäng dessa dagar"))));
}

/* ---------- ramverk ---------- */
const FLIKAR = [["slut", "Slutsålt"], ["ean", "Streckkoder"], ["allergener", "Allergener"], ["lunch", "Lunch"], ["frukost", "Frukost"], ["brunch", "Brunch"], ["hockey", "Hockey"], ["oppett", "Stängt"]];
function ritaFlikar(){
  $("tabs").replaceChildren(...FLIKAR.map(([id, t]) => h("button", {class: id === flik ? "on" : "", onclick: () => {
    if(id === flik) return;
    if(smutsig() && !confirm("Du har ändringar som inte är sparade. Byta flik ändå? (Ändringarna ligger kvar tills du laddar om sidan.)")) return;
    flik = id; ritaFlikar(); ritaVy(); }}, t + (BAS[id] !== ser(D[id]) ? " •" : ""))));
}
function ritaVy(){
  hämtaKort.aktiva = [];
  $("vy").replaceChildren(flik === "slut" ? vySlut() : flik === "ean" ? vyEan() : flik === "allergener" ? vyAllergener() : flik === "lunch" ? vyLunch() : flik === "frukost" || flik === "brunch" ? vyBuffe(flik) : flik === "oppett" ? vyStangt() : vyHockey());
  uppdStatus();
}
function uppdStatus(){
  const s = smutsig();
  $("status").textContent = s ? "Du har osparade ändringar." : "Inga osparade ändringar.";
  $("spara").disabled = !s;
  ritaFlikar();
}
async function spara(){
  const k = flik, knapp = $("spara");
  if(k === "ean"){
    const dåliga = [["Gemensam kod", D.ean.standardLunch], ...Object.entries(D.ean.rätter)].filter(([, c]) => c && !eanOk(c));
    if(dåliga.length) return toast("Rätta först: " + dåliga.slice(0, 3).map(x => x[0]).join(", ") + " har en ogiltig kod.", true);
    D.ean.rätter = Object.fromEntries(Object.entries(D.ean.rätter).filter(([, c]) => c));
  } knapp.disabled = true; knapp.textContent = "Sparar…";
  try {
    await api("/api/save", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({fil: FILNAMN[k], data: D[k]})});
    BAS[k] = ser(D[k]);
    toast("Sparat! Ändringen syns på TV:n inom ca 2 minuter.");
  } catch(e){
    toast(e.message, true);
    if(e.status === 401) visaLogin("Koden stämmer inte längre. Logga in igen.");
  }
  knapp.textContent = "Spara"; uppdStatus();
}
window.addEventListener("beforeunload", e => { if(Object.keys(D).some(k => D[k] && BAS[k] !== ser(D[k]))){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- inloggning ---------- */
function visaLogin(fel){
  $("app").hidden = true; $("login").hidden = false;
  $("loginfel").replaceChildren(fel ? h("div", {class: "fel"}, fel) : "");
}
async function start(){
  $("loginfel").replaceChildren();
  try {
    await api("/api/ping");
    try { $("kom").checked ? localStorage.setItem("lunchtv-pin", pin) : localStorage.removeItem("lunchtv-pin"); } catch(e){}
    await läs();
    $("login").hidden = true; $("app").hidden = false; ritaFlikar(); ritaVy();
  } catch(e){
    if(e.status === 401){ try { localStorage.removeItem("lunchtv-pin"); } catch(_){} }
    visaLogin(e.message);
  }
}
$("loggain").onclick = () => { pin = $("pin").value; start(); };
$("pin").addEventListener("keydown", e => { if(e.key === "Enter") $("loggain").click(); });
$("spara").onclick = spara;
$("loggaut").onclick = () => { if(smutsig() && !confirm("Du har osparade ändringar. Logga ut ändå?")) return; try { localStorage.removeItem("lunchtv-pin"); } catch(e){} location.reload(); };
(function(){
  $("login").hidden = false;
  if(!API){ $("loginfel").replaceChildren(h("div", {class: "fel"}, "Backoffice är inte kopplat till sin sparfunktion än. Se BACKOFFICE.md.")); return; }
  try { const p = localStorage.getItem("lunchtv-pin"); if(p){ pin = p; $("pin").value = p; start(); } } catch(e){}
})();
