<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice – Lunch-TV</title>
<style>
  :root { --svart:#111; --röd:#c8161d; --grön:#26722e; --grå:#e9e9e6; --linje:#cfcfca; --bg:#f4f4f2; --gul:#fff3c4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--svart); font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--svart); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 19px; flex: 1; }
  header img { height: 34px; width: 34px; }
  main { max-width: 900px; margin: 0 auto; padding: 14px 14px 120px; }
  button, input, select { font: inherit; }
  button { min-height: 46px; padding: 8px 16px; border: 1px solid var(--svart); background: #fff; color: var(--svart); border-radius: 8px; cursor: pointer; }
  button.prim { background: var(--svart); color: #fff; font-weight: 700; }
  button.liten { min-height: 38px; padding: 4px 12px; }
  button.fara { color: var(--röd); border-color: var(--röd); }
  button:disabled { opacity: .45; }
  input[type=text], input[type=password], input[type=time], input[type=date], input[type=number] { width: 100%; min-height: 46px; padding: 8px 10px; border: 1px solid #8c8c86; border-radius: 8px; background: #fff; }
  label.f { display: block; font-weight: 600; margin: 12px 0 4px; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 14px; flex-wrap: wrap; }
  .tabs button { flex: 1; min-width: 100px; padding: 8px 6px; font-weight: 700; }
  .tabs button.on { background: var(--svart); color: #fff; }
  .kort { background: #fff; border: 1px solid var(--linje); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .kort h3 { margin: 0 0 2px; font-size: 18px; }
  h2 { margin: 18px 0 4px; font-size: 21px; }
  h2.dag { text-transform: capitalize; }
  h2.dag { border-bottom: 3px solid var(--svart); padding-bottom: 3px; }
  .info { background: var(--gul); border: 1px solid #e0c96a; border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .fel { background: #fde4e4; border: 1px solid #e29a9a; color: #7a1010; border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .pill { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--grå); }
  .pill.ok { background: #d5ecd7; color: #174a1c; }
  .pill.sak { background: #fde4e4; color: #7a1010; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 14px 4px 6px; border: 2px solid var(--linje); border-radius: 99px; background: #fff; font-weight: 600; }
  .chip .ic { width: 34px; height: 34px; border-radius: 50%; background: #9a9a95; display: inline-flex; align-items: center; justify-content: center; }
  .chip .ic svg { width: 68%; height: 68%; }
  .chip.on { border-color: var(--svart); background: #fff; }
  .chip.on .ic { background: var(--svart); }
  .rad { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rad > * { flex: 1; min-width: 120px; }
  .rad > button { flex: none; min-width: 0; }
  .sticky { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--linje); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; z-index: 6; }
  .sticky .txt { flex: 1; font-size: 15px; }
  .sticky button { min-width: 150px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--grön); color: #fff; padding: 12px 18px; border-radius: 10px; z-index: 9; max-width: 90vw; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .toast.fel { background: var(--röd); color: #fff; border: 0; }
  .dagar label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; min-height: 40px; }
  .dagar input, .kryss input { width: 22px; height: 22px; }
  .kryss { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .datum { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--linje); border-radius: 8px; padding: 4px 4px 4px 12px; margin: 4px 6px 4px 0; }
  .datum.gammal { opacity: .45; }
  .datum.idag { border-color: var(--röd); font-weight: 700; }
  .dim { color: #55554f; font-size: 15px; }
  .ikonvis { display: inline-block; line-height: 0; color: #4b4f55; flex: none; }
  .ikonknapp { flex: none; min-width: 0 !important; width: 56px; height: 56px; border: 1px dashed var(--linje); border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #fafaf8; }
  .rättkort details summary { cursor: pointer; font-weight: 600; min-height: 40px; display: flex; align-items: center; }
  .ikongrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin: 8px 0 4px; }
  .ikonval { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 84px; padding: 6px 4px; }
  .ikonval.vald { border: 3px solid var(--grön); background: #eef7ee; }
  .ikonnamn { font-size: 12px; line-height: 1.1; text-align: center; }
  .streck { background: #fff; border: 1px solid var(--linje); line-height: 0; min-height: 44px; }
  .utseende { cursor: pointer; } .utseende.vald { border: 3px solid var(--grön); }
  #login { max-width: 420px; margin: 12vh auto; padding: 0 16px; }
</style>
</head>

<div id="login" hidden>
  <div class="kort">
    <h3>Backoffice – Lunch-TV</h3>
    <p class="dim">Skriv in koden för att ändra allergener, frukost och hockeykvällar.</p>
    <label class="f" for="pin">Kod</label>
    <input id="pin" type="password" autocomplete="current-password" inputmode="text">
    <div class="kryss"><input type="checkbox" id="kom" checked><label for="kom">Kom ihåg mig på den här enheten</label></div>
    <div id="loginfel"></div>
    <button class="prim" id="loggain" style="width:100%">Logga in</button>
  </div>

<script>

const CONFIG = {

const API = (new URLSearchParams(location.search).get("api") || CONFIG.api).replace(/\/$/, "");

/* ---------- hjälpare ---------- */
const nz = s => String(s).toLowerCase().replace(/\s+/g, " ").trim();
const stor = s => s.charAt(0).toUpperCase() + s.slice(1);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(k === "class") e.className = v; else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v === true) e.setAttribute(k, ""); else if(v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const $ = id => document.getElementById(id);
const ser = o => JSON.stringify(o);
const smutsig = () => Object.keys(D).some(k => D[k] && BAS[k] !== ser(D[k]));
function toast(t, fel){ const e = h("div", {class: "toast" + (fel ? " fel" : "")}, t); document.body.append(e); setTimeout(() => e.remove(), fel ? 7000 : 3500); }
const kopia = o => JSON.parse(JSON.stringify(o));

// Samma regel som TV-sidan och hamta_meny.py: namnet på rätten
function dela(r){
  if(r && typeof r === "object") return r.namn || "";
  const t = String(r).trim();
  let m = /^(.*?)\s+serveras\s+/i.exec(t); if(m) return m[1];
  m = /^(.*?)\s+[–-]\s+/.exec(t); if(m) return m[1];
  m = /^(.*?)\s+med\s+/i.exec(t); if(m) return m[1];
  return t;
}

async function api(väg, init){
  if(!API) throw new Error("Backoffice är inte kopplat till sin sparfunktion än (se BACKOFFICE.md).");
  let r;
  try { r = await fetch(API + väg, {...init, headers: {"x-pin": pin, ...(init && init.headers)}}); }
  catch(e){ throw new Error("Ingen kontakt med servern. Kontrollera nätverket."); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(j.fel || ("Fel " + r.status)); e.status = r.status; throw e; }
  return j;
}

/* ---------- allergenväljare (tre lägen: ej angivet / inga / valda) ---------- */
function allergVal(get, set, onChange){
  const wrap = h("div");
  const rita = () => {
    const v = get();
    const valda = Array.isArray(v) ? v : [];
    const pill = v === null || v === undefined ? h("span", {class: "pill sak"}, "Ej angivet – TV:n visar 'fråga personalen'")
      : !v.length ? h("span", {class: "pill ok"}, "Inga allergener")
      : h("span", {class: "pill ok"}, v.length + " valda");
    const chips = h("div", {class: "chips"}, ALLERGENER.map(([id, text, sym]) => {
      const på = valda.includes(id);
      return h("button", {type: "button", class: "chip" + (på ? " on" : ""), "aria-pressed": på, onclick: () => {
        const nya = på ? valda.filter(x => x !== id) : [...valda, id];
        set(nya.length ? ALLERGENER.map(a => a[0]).filter(x => nya.includes(x)) : null); rita(); onChange && onChange();
      }}, h("span", {class: "ic"}, svg(sym)), text);
    }));
    const knappar = h("div", {class: "rad"},
      h("button", {type: "button", class: "liten", onclick: () => { set([]); rita(); onChange && onChange(); }}, "Inga allergener"),
      h("button", {type: "button", class: "liten", onclick: () => { set(null); rita(); onChange && onChange(); }}, "Rensa (ej angivet)"));
    wrap.replaceChildren(pill, chips, knappar);
  };
  rita(); return wrap;
}
function svg(sym){
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#a-" + sym); s.append(u); return s;
}

/* ---------- inläsning ---------- */
async function läsMeny(){
  try { menu = (await api("/api/get?fil=menu.json")).data; } catch(e){ menu = null; }               // färskaste versionen direkt från GitHub
  if(!menu){ try { const r = await fetch("menu.json?t=" + Date.now(), {cache: "no-store"}); menu = r.ok ? await r.json() : null; } catch(e){ menu = null; } }
}
async function läs(){
  await läsMeny();

    const j = await api("/api/get?fil=" + FILNAMN[k]);

/* Allergener: rätterna kommer från veckans meny (menu.json). Befintliga svar behålls om det är samma vecka. */
function byggAllergener(a){
  const ny = {};
  const veckaOk = a && menu && a.vecka === menu.vecka;
  const gamla = veckaOk ? a.dagar || {} : {};
  if(a && a._info) ny._info = a._info;
  ny.vecka = menu ? menu.vecka : (a ? a.vecka : null);
  ny.dagar = {};
  for(const dag of DAGAR){
    ny.dagar[dag] = {};
    const befintliga = gamla[dag] || {};
    ((menu && menu.dagar && menu.dagar[dag]) || []).forEach(r => {
      const namn = dela(r);
      const nyckel = Object.keys(befintliga).find(k => nz(k) === nz(namn));
      ny.dagar[dag][namn] = nyckel === undefined || !Array.isArray(befintliga[nyckel]) ? null : befintliga[nyckel];
    });
  }
  ny.vegetariskt = veckaOk && Array.isArray(a.vegetariskt) ? a.vegetariskt : null;
  MSG.allergener = [];
  if(!menu) MSG.allergener.push("Kunde inte läsa veckans meny. Rätterna kan inte visas.");
  else if(!veckaOk && a) MSG.allergener.push("Det är en ny vecka (vecka " + menu.vecka + "). Allergenerna från förra veckan är rensade. Fyll i för de nya rätterna.");
  return ny;
}

/* ---------- vyer ---------- */
function vyAllergener(){

  if(menu.vegetariskt) alla.push(a.vegetariskt);

  rader.push(h("div", {class: klara === alla.length ? "info" : "info"}, h("b", {}, "Vecka " + menu.vecka + ": "), klara + " av " + alla.length + " rätter ifyllda.",
    klara < alla.length ? " Rätter som inte är ifyllda visar 'fråga personalen' på TV:n." : " Allt är ifyllt."));
  (MSG.allergener || []).forEach(m => rader.push(h("div", {class: "fel"}, m)));
  rader.unshift(hämtaKort());

    rader.push(h("h2", {class: "dag"}, d));
    rätter.forEach(namn => rader.push(h("div", {class: "kort"}, h("h3", {}, namn),
      allergVal(() => a.dagar[d][namn], v => a.dagar[d][namn] = v, uppdStatus))));
  });
  if(menu.vegetariskt){
    rader.push(h("h2", {class: "dag"}, "Veckans vegetariska"));
    rader.push(h("div", {class: "kort"}, h("h3", {}, dela(menu.vegetariskt)), allergVal(() => a.vegetariskt, v => a.vegetariskt = v, uppdStatus)));
  }
  return h("div", {}, rader);
}

/*EAN-START*/
/* ----- EAN-13 / EAN-8 streckkoder ----- */
const EAN_L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const EAN_R = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const EAN_PAR = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function eanKontroll(d){                                           // kontrollsiffra för en sifferrad utan kontrollsiffra
  let sum = 0;
  for(let i = d.length - 1, vikt = 3; i >= 0; i--, vikt = 4 - vikt) sum += Number(d[i]) * vikt;
  return (10 - sum % 10) % 10;
}
function eanOk(kod){                                               // giltig EAN-13 eller EAN-8 med rätt kontrollsiffra
  return /^(\d{8}|\d{13})$/.test(kod) && eanKontroll(kod.slice(0, -1)) === Number(kod.slice(-1));
}
function eanSvg(kod){
  const l13 = kod.length === 13, d = kod.split("").map(Number);
  let bitar = "101";
  if(l13){ const par = EAN_PAR[d[0]]; for(let i = 1; i <= 6; i++) bitar += (par[i - 1] === "L" ? EAN_L : EAN_G)[d[i]]; bitar += "01010"; for(let i = 7; i <= 12; i++) bitar += EAN_R[d[i]]; }
  else { for(let i = 0; i < 4; i++) bitar += EAN_L[d[i]]; bitar += "01010"; for(let i = 4; i < 8; i++) bitar += EAN_R[d[i]]; }
  bitar += "101";
  const vänster = l13 ? 11 : 7, höger = 7, bredd = vänster + bitar.length + höger, hög = 42, stapel = 34, vakt = 38;
  const vaktStap = i => i < 3 || i >= bitar.length - 3 || (l13 ? (i >= 45 && i < 50) : (i >= 31 && i < 36));
  let rect = "";
  for(let i = 0; i < bitar.length; ){
    if(bitar[i] !== "1"){ i++; continue; }
    let j = i; while(j < bitar.length && bitar[j] === "1") j++;
    rect += `<rect x="${vänster + i}" y="0" width="${j - i}" height="${vaktStap(i) ? vakt : stapel}"/>`; i = j;
  }

function påsk(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);

  return new Date(y, Math.floor(t / 31) - 1, (t % 31) + 1);
}

  const p = påsk(y), r = [], add = (d, n) => r.push([iso(d), n]);

  add(p, "Påskdagen"); add(plusDagar(p, 1), "Annandag påsk"); add(new Date(y, 4, 1), "Första maj");
  add(plusDagar(p, 39), "Kristi himmelsfärdsdag"); add(plusDagar(p, 49), "Pingstdagen"); add(new Date(y, 5, 6), "Nationaldagen");
  for(let i = 20; i <= 26; i++){ const x = new Date(y, 5, i); if(x.getDay() === 6) add(x, "Midsommardagen"); }
  for(let i = 0; i < 7; i++){ const x = new Date(y, 9, 31 + i); if(x.getDay() === 6) add(x, "Alla helgons dag"); }
  add(new Date(y, 11, 25), "Juldagen"); add(new Date(y, 11, 26), "Annandag jul");

  delar.push(...textFält("Rubrik", () => f.rubrik, v => f.rubrik = v));
  delar.push(h("h2", {}, "Rätter och drycker"));
  rader.forEach((r, i) => delar.push(V.kort({namn: r.namn, sättNamn: v => r.namn = v, pris: {get: () => r.pris, set: v => r.pris = v},
    taPris: {get: () => r.takeawayPris, set: v => { if(v) r.takeawayPris = v; else delete r.takeawayPris; }},
    besk: {get: () => r.beskrivning, set: v => r.beskrivning = v}, allerg: {get: () => r.allergener === undefined ? null : r.allergener, set: v => { if(v === null) delete r.allergener; else r.allergener = v; }}, ctrl: ctrlFör(rader, i)})));
  delar.push(h("button", {onclick: () => { rader.push({namn: "", pris: ""}); ritaVy(); uppdStatus(); window.scrollTo(0, document.body.scrollHeight); }}, "+ Lägg till rad"));
  delar.push(...kodDelar(V, []));
  return h("div", {}, delar);
}

/* ---------- Hockey ---------- */
function vyKategoriHockey(){
  const V = rattVerktyg(), k = D.hockey, rader = k.rader = k.rader || [];
  k.paket = k.paket || {namn: "", pris: ""};
  const delar = [h("div", {class: "info"}, "Alla hockeyrätter och drycker. Matchdagar, uppladdningstid och matchstart, och när koderna kan användas i kassan, ställer ni in under ", h("b", {}, "Inställningar"), ".")];
  delar.push(h("h2", {}, "Texter"));
  delar.push(...textFält("Rubrik", () => k.rubrik, v => k.rubrik = v));
  delar.push(...textFält("Text under rubriken", () => k.underrubrik, v => k.underrubrik = v));
  delar.push(...textFält("Bannertext (på lunch- och frukostskylten)", () => k.banner, v => k.banner = v));
  delar.push(h("h2", {}, "Rätter och drycker"));
  const allerg = r => ({get: () => r.allergener === undefined ? null : r.allergener, set: v => { if(v === null) delete r.allergener; else r.allergener = v; }});
  const taP = r => ({get: () => r.takeawayPris, set: v => { if(v) r.takeawayPris = v; else delete r.takeawayPris; }});
  rader.forEach((r, i) => delar.push(V.kort({namn: r.namn, sättNamn: v => r.namn = v, pris: {get: () => r.pris, set: v => r.pris = v}, taPris: taP(r),
    besk: {get: () => r.not, set: v => { if(v) r.not = v; else delete r.not; }, ph: "Notering, t.ex. fullständiga rättigheter"}, allerg: allerg(r), ctrl: ctrlFör(rader, i)})));
  delar.push(h("button", {onclick: () => { rader.push({namn: "", pris: ""}); ritaVy(); uppdStatus(); window.scrollTo(0, document.body.scrollHeight); }}, "+ Lägg till rad"));
  delar.push(h("h2", {}, "Paketpris"));
  delar.push(V.kort({namn: k.paket.namn, sättNamn: v => k.paket.namn = v, pris: {get: () => k.paket.pris, set: v => k.paket.pris = v}, taPris: taP(k.paket)}));
  delar.push(...kodDelar(V, []));
  return h("div", {}, delar);

/* ---------- Inställningar: tider, stängt och utseende ---------- */
function tidsRad(titel, get, set, ev){
  return h("div", {class: "rad"}, h("div", {}, h("label", {class: "f"}, titel[0]), h("input", {type: "time", value: get().start || "", oninput: e => { set({...get(), start: e.target.value}); uppdStatus(); }})),
    h("div", {}, h("label", {class: "f"}, titel[1]), h("input", {type: "time", value: get().slut || "", oninput: e => { set({...get(), slut: e.target.value}); uppdStatus(); }})));
}
function dagVal(f, rubrik){
  return [h("label", {class: "f"}, rubrik), h("div", {class: "dagar"}, ALLA_DAGAR.map(d => h("label", {}, h("input", {type: "checkbox", checked: (f.dagar || []).includes(d), onchange: e => {
    f.dagar = ALLA_DAGAR.filter(x => x === d ? e.target.checked : (f.dagar || []).includes(x)); uppdStatus(); }}), d)))];
}
function installLunch(){
  const l = D.lunch, ica = menu && menu.lunchtid, tider = h("div");
  const ritaTider = () => tider.replaceChildren(l.tid ? tidsRad(["Lunch visas från", "Lunch visas till"], () => l.tid, v => l.tid = v) : h("p", {class: "dim"}, "Just nu används ICA:s tider" + (ica ? ": " + ica.start + "–" + ica.slut + "." : ".")));
  ritaTider();
  return h("div", {class: "kort"}, h("h3", {}, "Lunch"),
    h("div", {class: "kryss"}, h("input", {type: "checkbox", id: "egna", checked: !!l.tid, onchange: e => { l.tid = e.target.checked ? {start: (ica && ica.start) || "11:00", slut: (ica && ica.slut) || "14:30"} : null; ritaTider(); uppdStatus(); }}), h("label", {for: "egna"}, "Egna lunchtider (annars används ICA:s" + (ica ? ": " + ica.start + "–" + ica.slut : "") + ")")),
    tider, ...dagVal(l, "Dagar då lunch serveras"),
    kassaTidFält(l, () => l.tid || (ica ? {start: ica.start, slut: ica.slut} : {start: "11:00", slut: "14:30"})));
}
function installBuffe(key){
  const f = D[key], ORD = key === "brunch" ? "Brunch" : "Frukost";
  return h("div", {class: "kort"}, h("h3", {}, ORD),
    tidsRad([ORD + " visas från", ORD + " visas till"], () => f.tid, v => f.tid = v), ...dagVal(f, "Dagar då " + ORD.toLowerCase() + " serveras"),
    kassaTidFält(f, () => ({start: f.tid.start, slut: f.tid.slut})));
}
function installHockey(){
  const k = D.hockey, idag = iso(new Date()); k.datum = k.datum || [];
  const datumDiv = h("div");
  const ritaDatum = () => {
    k.datum = [...new Set(k.datum)].sort();
    const veckodag = s => ["sön","mån","tis","ons","tors","fre","lör"][new Date(s + "T12:00:00").getDay()];
    datumDiv.replaceChildren(...k.datum.map(s => h("span", {class: "datum" + (s < idag ? " gammal" : s === idag ? " idag" : "")}, veckodag(s) + " " + s,
      h("button", {class: "liten", "aria-label": "Ta bort " + s, onclick: () => { k.datum = k.datum.filter(x => x !== s); ritaDatum(); uppdStatus(); }}, "✕"))));
    if(!k.datum.length) datumDiv.append(h("span", {class: "dim"}, "Inga datum. Hockeyskylten visas inte."));
  };
  ritaDatum();
  const nyttDatum = h("input", {type: "date", style: "max-width:220px"});
  return h("div", {class: "kort"}, h("h3", {}, "Hockeykväll"),
    h("p", {class: "dim"}, "Hockeyskylten visas från uppladdningens start till matchstart på matchdagarna. Hela dagen fram till matchstart visas dessutom en liten banner på de andra skyltarna."),
    h("label", {class: "f"}, "Matchdagar (hemma)"), datumDiv,
    h("div", {class: "rad", style: "margin-top:8px"}, nyttDatum, h("button", {onclick: () => { if(!nyttDatum.value) return; k.datum.push(nyttDatum.value); nyttDatum.value = ""; ritaDatum(); uppdStatus(); }}, "+ Lägg till datum")),
    h("div", {class: "rad"},
      h("div", {}, h("label", {class: "f"}, "Uppladdning från (skylten visas)"), h("input", {type: "time", value: (k.tid || {}).start || "", oninput: e => { k.tid = {...k.tid, start: e.target.value}; uppdStatus(); }})),
      h("div", {}, h("label", {class: "f"}, "Matchstart"), h("input", {type: "time", value: k.matchstart || "", oninput: e => { k.matchstart = e.target.value; uppdStatus(); }}))),
    kassaTidFält(k, () => ({start: (k.tid || {}).start || "16:30", slut: k.matchstart || "19:00"})));
}
function vyInstallningar(){
  return h("div", {},
    h("div", {class: "info"}, "Här ställer ni in ", h("b", {}, "när varje vy visas på skylten"), ", ", h("b", {}, "när streckkoderna kan användas i kassan"), " (egna kassatider), när restaurangen är ", h("b", {}, "stängd"), " och vilket ", h("b", {}, "utseende"), " skärmarna ska ha."),
    h("h2", {}, "Tider och dagar"), installLunch(), installBuffe("frukost"), installBuffe("brunch"), installHockey(),
    h("h2", {}, "Stängt"), vyStangt(),
    h("h2", {}, "Utseende"), vyUtseende());
}

/* ---------- Utseende ---------- */
function vyUtseende(){
  const u = D.utseende;
  const val = (id, titel, text) => h("label", {class: "kort utseende" + (u.tema === id ? " vald" : "")},
    h("div", {class: "rad"}, h("input", {type: "radio", name: "tema", checked: u.tema === id, style: "flex:none;width:24px;height:24px;min-width:0", onchange: () => { u.tema = id; ritaVy(); uppdStatus(); }}),
      h("div", {style: "flex:1"}, h("h3", {}, titel), h("div", {class: "dim"}, text)),
      h("a", {href: "index.html?tema=" + id, target: "_blank", rel: "noopener", class: "liten", style: "flex:none;display:inline-block;padding:8px 14px;border:1px solid var(--svart);border-radius:8px;color:var(--svart);text-decoration:none;background:#fff", onclick: ev => ev.stopPropagation()}, "Förhandsgranska")));
  return h("div", {},
    h("div", {class: "info"}, "Välj vilket utseende TV:n och kassan ska ha som standard. Allt innehåll är samma, bara färger och dekor skiljer. Valet gäller alla enheter: TV:n, kassan och iPaden. Det går inte att växla på enskilda enheter."),
    val("klassisk", "Klassiskt", "Vit kakelvägg, betongskylt, svart text. Så som skylten ser ut i dag."),
    val("industri", "Industriellt", "Mörk bakgrund, rostfritt stål, koppar och varm gul glöd."));
}

/* ---------- ramverk ---------- */
const FLIKAR = [["lunch", "Lunch"], ["frukost", "Frukost"], ["brunch", "Brunch"], ["hockey", "Hockey"], ["installningar", "Inställningar"]];
const FLIK_DATA = {lunch: ["lunch", "allergener", "ean", "bilder", "slut"], frukost: ["frukost", "ean", "bilder", "slut"], brunch: ["brunch", "ean", "bilder", "slut"], hockey: ["hockey", "ean", "bilder", "slut"], installningar: ["lunch", "frukost", "brunch", "hockey", "oppett", "utseende"]};
const flikSmutsig = id => (FLIK_DATA[id] || [id]).some(k => D[k] && BAS[k] !== ser(D[k]));
function ritaFlikar(){
  $("tabs").replaceChildren(...FLIKAR.map(([id, t]) => h("button", {class: id === flik ? "on" : "", onclick: () => {
    if(id === flik) return;
    flik = id; ritaFlikar(); ritaVy(); }}, t + (flikSmutsig(id) ? " •" : ""))));
}
function ritaVy(){
  hämtaKort.aktiva = [];
  $("vy").replaceChildren(flik === "lunch" ? vyLunchRatter() : flik === "frukost" || flik === "brunch" ? vyKategoriBuffe(flik) : flik === "hockey" ? vyKategoriHockey() : vyInstallningar());
  uppdStatus();
}
function uppdStatus(){
  const s = smutsig();
  $("status").textContent = s ? "Du har osparade ändringar." : "Inga osparade ändringar.";
  $("spara").disabled = !s;
  ritaFlikar();
}
async function spara(){
  const knapp = $("spara"), ändrade = Object.keys(D).filter(k => D[k] && BAS[k] !== ser(D[k]));
  if(!ändrade.length) return;
  if(ändrade.includes("ean")){
    const dåliga = [["Gemensam kod", D.ean.standardLunch], ["Gemensam takeaway-kod", D.ean.standardTakeaway], ...Object.entries(D.ean.rätter), ...Object.entries(D.ean.takeaway || {}).map(([n, c]) => ["Takeaway " + n, c])].filter(([, c]) => c && !eanOk(c));
    if(dåliga.length) return toast("Rätta först: " + dåliga.slice(0, 3).map(x => x[0]).join(", ") + " har en ogiltig kod.", true);
    D.ean.rätter = Object.fromEntries(Object.entries(D.ean.rätter).filter(([, c]) => c));
    D.ean.takeaway = Object.fromEntries(Object.entries(D.ean.takeaway || {}).filter(([, c]) => c));
  }
  if(ändrade.includes("bilder")) D.bilder.rätter = Object.fromEntries(Object.entries(D.bilder.rätter).filter(([, c]) => c));
  knapp.disabled = true; knapp.textContent = "Sparar…";
  let sparade = 0;
  for(const k of Object.keys(D).filter(k => D[k] && BAS[k] !== ser(D[k]))){
    try {
      await api("/api/save", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({fil: FILNAMN[k], data: D[k]})});
      BAS[k] = ser(D[k]); sparade++;
    } catch(e){
      toast((sparade ? "Sparade " + sparade + " av " + ändrade.length + ". " : "") + FILNAMN[k] + ": " + e.message, true);
      if(e.status === 401) visaLogin("Koden stämmer inte längre. Logga in igen.");
      knapp.textContent = "Spara"; uppdStatus(); return;
    }
  }
  toast("Sparat! Ändringen syns på TV:n inom ca 2 minuter.");
  knapp.textContent = "Spara"; ritaVy();
}
window.addEventListener("beforeunload", e => { if(Object.keys(D).some(k => D[k] && BAS[k] !== ser(D[k]))){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- inloggning ---------- */
function visaLogin(fel){
  $("app").hidden = true; $("login").hidden = false;
  $("loginfel").replaceChildren(fel ? h("div", {class: "fel"}, fel) : "");
}
async function start(){
  $("loginfel").replaceChildren();
  try {
    await api("/api/ping");
    try { $("kom").checked ? localStorage.setItem("lunchtv-pin", pin) : localStorage.removeItem("lunchtv-pin"); } catch(e){}
    await läs();
    $("login").hidden = true; $("app").hidden = false; ritaFlikar(); ritaVy();
  } catch(e){
    if(e.status === 401){ try { localStorage.removeItem("lunchtv-pin"); } catch(_){} }
    visaLogin(e.message);
  }
}
$("loggain").onclick = () => { pin = $("pin").value; start(); };
$("pin").addEventListener("keydown", e => { if(e.key === "Enter") $("loggain").click(); });
$("spara").onclick = spara;
$("loggaut").onclick = () => { if(smutsig() && !confirm("Du har osparade ändringar. Logga ut ändå?")) return; try { localStorage.removeItem("lunchtv-pin"); } catch(e){} location.reload(); };
(function(){
  $("login").hidden = false;
  if(!API){ $("loginfel").replaceChildren(h("div", {class: "fel"}, "Backoffice är inte kopplat till sin sparfunktion än. Se BACKOFFICE.md.")); return; }
  try { const p = localStorage.getItem("lunchtv-pin"); if(p){ pin = p; $("pin").value = p; start(); } } catch(e){}
})();
